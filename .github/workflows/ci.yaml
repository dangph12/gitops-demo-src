name: CI

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Image
        run: |
            docker build \
              -t ghcr.io/${{ github.repository_owner }}/app-backend:${{ github.sha }} \
              ./backend
      - name: Push Image
        run: |
            docker push \
              ghcr.io/${{ github.reposiroty_owner }}/app-backend:${{ github.sha }}
